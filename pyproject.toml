[project]
name = "aihack4"
version = "0.1.0"
description = "PODO: 공모전 참여 가능성 판정과 준비 계획"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.0",
    "httpx2>=2.14.0",
    "olefile>=0.47",
    "openai>=3.42.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
aihack4 = "aihack4:main"

[project.optional-dependencies]
timetable = [
    "google-genai>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
